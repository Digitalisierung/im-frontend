<div class="topbar">
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <button class="btn btn-link d-lg-none me-2" (click)="toggleSidebar()" data-testid="button-sidebar-toggle">
        <i class="bi bi-list fs-4"></i>
      </button>
      <h5 class="mb-0" data-testid="text-page-title">{{ getPageTitle() }} - BITech AG</h5>
    </div>
    <div class="d-flex align-items-center">
      <div class="me-3">
        <span class="text-muted small">API Status:</span>
        <span class="badge bg-success ms-1" data-testid="status-api">{{ apiStatus }}</span>
      </div>
      <div class="dropdown">
        <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" data-testid="button-user-menu">
          <i class="bi bi-person-circle me-1"></i>
          <span>Admin</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" data-testid="link-profile"><i class="bi bi-person me-2"></i>Profil</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="#" data-testid="link-logout"><i class="bi bi-box-arrow-right me-2"></i>Abmelden</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
